kind = "web"
previewPath = "/"
title = "Omni-Code AI"
version = "1.0.0"
id = "artifacts/health-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21041

[services.development]
run = "pnpm --filter @workspace/health-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/health-ai", "run", "build" ]
publicDir = "artifacts/health-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21041"
BASE_PATH = "/"
